<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog Personal</title>
</head>
<body>
<h1>Entradas del Blog</h1>
<a th:href="@{/posts/nuevo}">Crear Nueva Entrada</a>

<div th:if="${posts.empty}">
    <p>No hay entradas aún</p>
</div>

<div th:unless="${posts.empty}">
    <table>
        <tr th:each="post : ${posts}">
            <td th:text="${post.titulo}"></td>
            <td th:text="${post.autor} ?: 'Anónimo'"></td>
            <td th:text="${post.fechaPublicacion}"></td>
            <td>
                <a th:href="@{/posts/editar/{id}(id=${post.id})}">Editar</a>
                <a th:href="@{/posts/eliminar/{id}(id=${post.id})}"
                   onclick="return confirm('¿Eliminar esta entrada?')">Eliminar</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
