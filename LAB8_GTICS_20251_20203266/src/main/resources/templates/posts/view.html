<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.titulo}">Entrada del Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${post.titulo}"></h1>
    <div class="text-muted mb-3">
        <span th:text="${post.autor} ?: 'Anónimo'"></span> |
        <span th:text="${#temporals.format(post.fechaPublicacion, 'dd/MM/yyyy HH:mm')}"></span> |
        <span th:text="${post.categoria} ?: 'Sin categoría'"></span>
    </div>

    <div th:utext="${post.contenido}"></div>

    <div class="mt-4">
        <a th:href="@{/posts/editar/{id}(id=${post.id})}" class="btn btn-warning">Editar</a>
        <a th:href="@{/posts}" class="btn btn-secondary">Volver al listado</a>
    </div>
</div>
</body>
</html>
