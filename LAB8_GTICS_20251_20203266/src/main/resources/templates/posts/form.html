<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.id != null} ? 'Editar Entrada' : 'Nueva Entrada'">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${post.id != null} ? 'Editar Entrada' : 'Nueva Entrada'"></h1>

    <form th:action="${post.id != null} ? @{/posts/editar/{id}(id=${post.id})} : @{/posts/nuevo}"
          th:object="${post}" method="post">
        <div class="mb-3">
            <label for="titulo" class="form-label">Título *</label>
            <input type="text" class="form-control" id="titulo" th:field="*{titulo}" required>
            <div th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="contenido" class="form-label">Contenido *</label>
            <textarea class="form-control" id="contenido" th:field="*{contenido}" rows="5" required></textarea>
            <div th:if="${#fields.hasErrors('contenido')}" th:errors="*{contenido}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="autor" class="form-label">Autor</label>
            <input type="text" class="form-control" id="autor" th:field="*{autor}">
        </div>

        <div class="mb-3">
            <label for="categoria" class="form-label">Categoría</label>
            <input type="text" class="form-control" id="categoria" th:field="*{categoria}">
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/posts}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
